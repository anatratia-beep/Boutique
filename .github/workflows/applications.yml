# Construit les applications Boutique (Android .apk, Windows .exe, Mac .dmg) et les publie.
# Se lance à chaque modification du logiciel, ou à la main : onglet Actions → « Applications » → Run workflow.
# Android : signé avec la clé du vendeur (secrets ANDROID_KEYSTORE_*), pour que les mises à jour s'installent par-dessus.
# Publication : dans le dépôt public de téléchargements (DOWNLOAD_REPO) si le secret RELEASES_TOKEN existe,
# sinon dans les « Releases » de ce dépôt. Le code du logiciel, lui, peut rester privé.
# Mises à jour automatiques : avec le secret UPDATE_SIGNING_KEY, un paquet signé (update.json + web-<version>.json)
# est ajouté ; les applications installées le téléchargent et l'utilisent au démarrage suivant.
name: Applications
on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'electron/**', 'android-config/**', 'capacitor.config.json', 'package.json', 'scripts/build.mjs', 'scripts/make-update.mjs', '.github/workflows/applications.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: applications
  cancel-in-progress: true
env:
  APP_VERSION: 1.0.${{ github.run_number }}
  DOWNLOAD_REPO: anatratia-beep/Boutique-telechargements
  NOTES: |
    **Android** : téléchargez le fichier `.apk`, ouvrez-le sur le téléphone et autorisez l'installation.
    **Windows** : téléchargez le fichier `.exe` et lancez-le. Si Windows affiche « Windows a protégé votre ordinateur », cliquez « Informations complémentaires » puis « Exécuter quand même ».
    **Mac** : téléchargez le fichier `.dmg`, ouvrez-le et glissez Boutique dans Applications. Au premier lancement, si le Mac refuse de l'ouvrir : Réglages Système → Confidentialité et sécurité → « Ouvrir quand même ».
    Au premier lancement, le logiciel demande une clé de licence. Ensuite, les mises à jour arrivent toutes seules.

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: web, path: dist, retention-days: 3 }

  android:
    needs: web
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web, path: dist }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Projet Android (Capacitor)
        run: |
          npm install --no-save --no-audit --no-fund @capacitor/cli@6.2.0 @capacitor/core@6.2.0 @capacitor/android@6.2.0 @capacitor/filesystem@^6.0.0 @capacitor/local-notifications@^6.0.0
          npx cap add android
          npx cap sync android
          pip install pillow
          python3 android-config/apply.py
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"${APP_VERSION}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
      - name: Construction de l'APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Signature
        id: sign
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p out
          if [ -z "$KS_B64" ] || [ -z "$KS_PW" ]; then
            echo "::warning::Clé de signature Android absente (secrets ANDROID_KEYSTORE_B64 et ANDROID_KEYSTORE_PASSWORD). APK construit mais non signé : il ne sera pas publié."
            echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$KS_B64" | base64 -d > release.keystore
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-key-alias boutique --ks-pass env:KS_PW --key-pass env:KS_PW --out "out/Boutique-${APP_VERSION}.apk" aligned.apk
          "$BT/apksigner" verify --print-certs "out/Boutique-${APP_VERSION}.apk"
          rm -f release.keystore
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.sign.outputs.signed == 'true'
        with: { name: android, path: out/*.apk, retention-days: 7 }

  windows:
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web, path: electron/web }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Construction de l'installateur
        working-directory: electron
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npm version "$APP_VERSION" --no-git-tag-version --allow-same-version
          npx electron-builder --win --publish never
          ls release
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: electron/release/*.exe, retention-days: 7 }

  mac:
    needs: web
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web, path: electron/web }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Construction de l'application Mac
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install --no-audit --no-fund
          npm version "$APP_VERSION" --no-git-tag-version --allow-same-version
          npx electron-builder --mac --publish never
          ls release
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: electron/release/*.dmg, retention-days: 7 }

  release:
    needs: [web, android, windows, mac]
    # La version Mac est un plus : si elle échoue, Android et Windows sont quand même publiés.
    if: ${{ always() && needs.android.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
      UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: files, pattern: '{android,windows,mac}', merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { name: web, path: dist }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Paquet de mise à jour automatique (signé)
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ] || [ "$HAS_TOKEN" != "true" ]; then
            echo "::warning::Pas de mise à jour automatique : secrets UPDATE_SIGNING_KEY et RELEASES_TOKEN nécessaires."
          else
            node scripts/make-update.mjs dist files
          fi
          ls -la files
      - name: Publication dans le dépôt de téléchargements
        if: env.HAS_TOKEN == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.DOWNLOAD_REPO }}
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: v${{ env.APP_VERSION }}
          name: Boutique ${{ env.APP_VERSION }}
          make_latest: true
          body: ${{ env.NOTES }}
          files: files/*
      - name: Publication dans ce dépôt (sans dépôt de téléchargements)
        if: env.HAS_TOKEN != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Boutique ${{ env.APP_VERSION }}
          make_latest: true
          body: ${{ env.NOTES }}
          files: files/*
